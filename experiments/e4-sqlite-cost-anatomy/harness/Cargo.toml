[package]
name = "kiln-e4-harness"
version = "0.1.0"
edition = "2024"
publish = false
build = "build.rs"

# Its own, empty workspace table: this crate is not a member of any root
# workspace (protocol.md §12, issue #19).
[workspace]

[features]
# The passthrough build protocol §5's overhead bound compares the
# instrumented build against: same code path, the timing VFS shim's two
# `clock_gettime` calls around `xWrite`/`xSync` skipped (see src/vfs.rs).
# Selected at build time (`cargo build --release --features
# passthrough_shim`) so nothing else about the binary changes.
passthrough_shim = []

[dependencies]
# Versions frozen by protocol.md §4/§12; keep both in lockstep so the
# bundled SQLite build is the one the direct FFI (libsqlite3-sys) and
# rusqlite's high-level API share.
rusqlite = { version = "0.40.2", features = ["bundled"] }
libsqlite3-sys = { version = "0.38.2", features = ["bundled"] }
# PRNG frozen by protocol.md §2.1.
rand_chacha = "0.10.0"
rand_core = "0.10.0"
# SHA-256 for the initial-load email derivation (protocol.md §2.1) and the
# preflight binary hash (protocol.md §12).
sha2 = "0.10"
# CPU affinity and CLOCK_THREAD_CPUTIME_ID (protocol.md §5, §9).
libc = "0.2"
# The pilot (protocol.md §13) needs its own scratch directory for a real
# SQLite file at run time, not only in tests, so this is a normal
# dependency rather than a dev-only one.
tempfile = "3"

[profile.release]
# The one build measurements run against (protocol.md §12).
opt-level = 3
debug = true
lto = false
